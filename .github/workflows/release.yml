name: Release

# Started manually (Actions > Release > Run workflow). Builds the release ZIP(s) from the
# given source ref (default: the commit the workflow runs on) and creates the GitHub release
# v<version> with all ZIPs attached, by default as a DRAFT: the workflow token may not create
# a tag on an older commit (403), so a person publishes the draft (Releases > Edit > Publish),
# which creates the tag v<version> on the source commit with that person's rights.
# For an older commit even creating the draft fails with 403 (seen for v1.1.9): then push the tag
# yourself first (git tag v<version> <sha>; git push origin v<version>), or in the web UI create a
# branch on that commit and publish a release v<version> with that branch as target; then run the
# workflow again: an existing tag that points to the source commit is accepted, and an existing
# published release is completed (ZIPs, title, notes, latest/pre-release).
# Per version, these files must exist in .github/release-notes/ on the branch the workflow runs on:
#   v<version>.md               release notes
#   v<version>.<package>.files  one file list per package (e.g. v1.2.0.gpo.files, v1.2.0.acmp.files);
#                               each becomes HostRename-<version>-<package>.zip
#   or v<version>.files         legacy format (one package, HostRename-<version>.zip), e.g. for v1.1.9
# File list format, one entry per line ("#" starts a comment):
#   <source>                    path or glob relative to the repo root; copied to the same relative path
#   <source> => <target>        path (no glob) copied to <target>, relative inside the package
#                               (a folder is copied with its contents into <target>)
# Each ZIP contains one folder with the same name as the ZIP. Any missing source fails the build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 1.2.0 (must match $ScriptVersion in Invoke-HostRename.ps1 of the source ref)'
        required: true
      source_ref:
        description: 'Commit SHA, branch or tag to package (empty = the commit this workflow runs on)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true
      draft:
        description: 'Create as draft (publish it on GitHub afterwards; creates the tag then)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow branch (release notes and file lists)
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Checkout source to package
        uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Check version, release notes and file lists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          grep -q "^\$ScriptVersion = '$VERSION'" src/Invoke-HostRename.ps1 || { echo "\$ScriptVersion in Invoke-HostRename.ps1 of the source ref is not $VERSION"; exit 1; }
          test -f "meta/.github/release-notes/v$VERSION.md" || { echo "Missing .github/release-notes/v$VERSION.md"; exit 1; }
          lists=( "meta/.github/release-notes/v$VERSION".*.files )
          legacy="meta/.github/release-notes/v$VERSION.files"
          if [ -f "$legacy" ] && [ ${#lists[@]} -gt 0 ]; then echo "Both v$VERSION.files and v$VERSION.<package>.files exist; keep one format"; exit 1; fi
          if [ ! -f "$legacy" ] && [ ${#lists[@]} -eq 0 ]; then echo "Missing .github/release-notes/v$VERSION.<package>.files (or legacy v$VERSION.files)"; exit 1; fi
          SOURCE_SHA="$(git -C src rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          # An existing tag is accepted only if it points to the source commit (e.g. a tag the owner
          # pushed for an older commit, which the workflow token may not create itself).
          git -C meta fetch -q --tags origin
          if git -C meta rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            TAG_SHA="$(git -C meta rev-parse "v$VERSION^{commit}")"
            [ "$TAG_SHA" = "$SOURCE_SHA" ] || { echo "Tag v$VERSION exists but points to $TAG_SHA, not to the source $SOURCE_SHA"; exit 1; }
            echo "Tag v$VERSION already exists on the source commit; the release uses it."
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Build ZIPs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          notes="$PWD/meta/.github/release-notes"
          dist="$PWD/dist"
          mkdir -p "$dist"
          lists=( "$notes/v$VERSION".*.files )
          [ ${#lists[@]} -gt 0 ] || lists=( "$notes/v$VERSION.files" )
          safe_rel() { [[ -n "$1" && "$1" != /* && "/$1/" != */../* ]]; }
          : > "$dist/zips.txt"
          for list in "${lists[@]}"; do
            base="$(basename "$list" .files)"            # v1.2.0.acmp or v1.2.0
            package="${base#"v$VERSION"}"; package="${package#.}"
            if [ -z "$package" ]; then dir="HostRename-$VERSION"
            elif [[ "$package" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then dir="HostRename-$VERSION-$package"
            else echo "Invalid package name '$package' in $(basename "$list")"; exit 1; fi
            echo "== $dir (from $(basename "$list"))"
            out="$dist/$dir"
            mkdir -p "$out"
            pushd src >/dev/null
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%%#*}"; line="$(echo "$line" | xargs)"
              [ -z "$line" ] && continue
              if [[ "$line" == *"=>"* ]]; then
                source="$(echo "${line%%=>*}" | xargs)"; target="$(echo "${line#*=>}" | xargs)"
                safe_rel "$source" && safe_rel "$target" || { echo "Invalid entry '$line' (relative paths without .. only)"; exit 1; }
                [[ "$source" != *[\*\?\[]* ]] || { echo "Glob not allowed with a target: '$line'"; exit 1; }
                [ -e "$source" ] || { echo "Missing source '$source'"; exit 1; }
                if [ -d "$source" ]; then
                  mkdir -p "$out/$target"; cp -r "$source/." "$out/$target/"
                else
                  [ ! -e "$out/$target" ] || { echo "Target '$target' already exists in $dir"; exit 1; }
                  mkdir -p "$(dirname "$out/$target")"; cp "$source" "$out/$target"
                fi
              else
                safe_rel "$line" || { echo "Invalid entry '$line' (relative paths without .. only)"; exit 1; }
                matches=( $line )
                [ ${#matches[@]} -gt 0 ] || { echo "No file matches '$line'"; exit 1; }
                for m in "${matches[@]}"; do
                  [ -e "$m" ] || { echo "Missing source '$m'"; exit 1; }
                  cp -r --parents "$m" "$out/"
                done
              fi
            done < "$list"
            popd >/dev/null
            (cd "$dist" && zip -q -r -X "$dir.zip" "$dir" && unzip -l "$dir.zip")
            echo "dist/$dir.zip" >> "$dist/zips.txt"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft)
          elif [ "$PRERELEASE" != "true" ]; then flags+=(--latest); fi
          mapfile -t zips < dist/zips.txt
          [ ${#zips[@]} -gt 0 ] || { echo "No ZIP was built"; exit 1; }
          existing="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || true)"
          # A draft of this version created by an earlier run is replaced (drafts have no tag yet).
          if [ "$existing" = "true" ]; then
            echo "Replacing the existing draft of v$VERSION"
            gh release delete "v$VERSION" --yes
          # A release the owner already published by hand (e.g. to create the tag on an older commit
          # in the web UI) is completed: ZIPs uploaded, title and notes set, pre-release/latest flag.
          elif [ "$existing" = "false" ]; then
            [ "$TAG_EXISTS" = "true" ] || { echo "Release v$VERSION exists but its tag does not point to the source"; exit 1; }
            echo "Completing the existing release v$VERSION"
            gh release upload "v$VERSION" "${zips[@]}" --clobber
            edit=(--title "HostRename $VERSION" --notes-file "meta/.github/release-notes/v$VERSION.md")
            if [ "$PRERELEASE" = "true" ]; then edit+=(--prerelease); else edit+=(--prerelease=false --latest); fi
            gh release edit "v$VERSION" "${edit[@]}"
            exit 0
          fi
          # With an existing tag, --target is not passed (the tag defines the commit).
          if [ "$TAG_EXISTS" != "true" ]; then flags+=(--target "$SOURCE_SHA"); fi
          gh release create "v$VERSION" "${zips[@]}" \
            --title "HostRename $VERSION" \
            --notes-file "meta/.github/release-notes/v$VERSION.md" \
            "${flags[@]}"
